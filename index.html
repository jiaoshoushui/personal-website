<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://raw.githubusercontent.com">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="description" content="个人主页 — 开发者、创造者">
    <title>首页</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('site-theme')
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark')
          document.documentElement.style.colorScheme = t === 'light' ? 'light' : 'dark'
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }

        /* 安卓平板横屏：联想等浏览器 viewport 过窄时提前修正，避免两侧大黑边 */
        try {
          var sw = Math.max(screen.width, screen.height)
          var sh = Math.min(screen.width, screen.height)
          var landscape = window.matchMedia('(orientation: landscape)').matches
          var coarse = window.matchMedia('(pointer: coarse)').matches
          if (landscape && coarse && sh >= 600 && window.innerWidth < sw * 0.72) {
            var meta = document.querySelector('meta[name=viewport]')
            if (meta) {
              meta.setAttribute('content', 'width=' + sw + ', initial-scale=1, viewport-fit=cover')
              document.documentElement.setAttribute('data-viewport-fixed', '1')
            }
          }
        } catch (e2) {}
      })()
    </script>

  </head>

  </body>
</html>
